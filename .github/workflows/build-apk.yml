name: Compilar APK

# Cada vez que subes cambios a la rama main se compila una versión nueva
# y se publica como "Release" en GitHub con dos archivos:
#   - GestionPrestamos-1.0.N.apk  -> para instalar la app o cambios nativos
#   - www-N-nM-hHASH.zip          -> actualización EN VIVO (sin instalar APK)
# M = versión mínima del APK que puede usar ese paquete. Si cambia la parte
# nativa (Android, complementos, capacitor.config.json), M sube y la app pide APK.
#
# REGLA PARA NO PERDER DATOS AL ACTUALIZAR (no cambiar):
#   - applicationId: com.piscuish.prestamos
#   - firma: android/app/debug.keystore
#   - versionCode siempre mayor (usa el número de ejecución del workflow)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Versión nativa mínima (decide si la actualización puede ser en vivo)
        id: nat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=$((${{ github.run_number }} + 100))
          # Solo cuenta lo que cambia la comunicación entre la app y Android:
          # complementos (package.json), capacitor.config.json y AndroidManifest.
          # El ícono, la pantalla de carga y otras imágenes NO bloquean las actualizaciones en vivo.
          HASH=$( (sha256sum capacitor.config.json android/app/src/main/AndroidManifest.xml; node -e "console.log(JSON.stringify(require('./package.json').dependencies))") | sha256sum | cut -c1-10)
          COMPAT=$(tr -dc '0-9' < android-compat.txt)
          PREV=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/updates/latest.json" || echo '{}')
          PREV_HASH=$(echo "$PREV" | jq -r '.nativeHash // ""')
          PREV_MIN=$(echo "$PREV" | jq -r '.minNative // 0')
          MIN=$COMPAT
          if [ -n "$PREV_HASH" ] && [ "$PREV_HASH" != "$HASH" ] && [ "$COMPAT" -le "$PREV_MIN" ]; then
            echo "Cambió la parte nativa (complementos/permisos) y android-compat.txt no se actualizó: se exige este APK."
            MIN=$BUILD
          elif [ -n "$PREV_HASH" ] && [ "$PREV_HASH" = "$HASH" ] && [ "$PREV_MIN" -gt "$MIN" ]; then
            MIN=$PREV_MIN
          fi
          echo "hash nativo: $HASH (antes: ${PREV_HASH:-ninguno}) | APK mínimo: $MIN"
          echo "min=$MIN" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Copiar la app al proyecto Android
        run: npx cap sync android

      - name: Número de versión
        id: ver
        run: |
          BUILD=$((${{ github.run_number }} + 100))
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$BUILD" >> "$GITHUB_OUTPUT"
          sed -i -E "s/versionCode [0-9]+/versionCode $BUILD/; s/versionName \"[^\"]*\"/versionName \"1.0.$BUILD\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GestionPrestamos-${{ steps.ver.outputs.name }}.apk

      - name: Paquete para actualización en vivo
        run: |
          cd www && zip -qr "../www-${{ steps.ver.outputs.build }}-n${{ steps.nat.outputs.min }}-h${{ steps.nat.outputs.hash }}.zip" . && cd ..
          ls -l www-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GestionPrestamos-${{ steps.ver.outputs.name }}
          path: GestionPrestamos-*.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Versión ${{ steps.ver.outputs.name }}
          body: ${{ github.event.head_commit.message || 'Nueva versión' }}
          files: |
            GestionPrestamos-*.apk
            www-*.zip
          make_latest: true

      # Archivo pequeño con la última versión, en la rama "updates".
      # La app lo lee desde raw.githubusercontent.com, que no tiene el límite
      # de consultas por hora de la API de GitHub (importante con datos móviles).
      - name: Publicar aviso de última versión (latest.json)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message || 'Nueva versión' }}
        run: |
          NAME=${{ steps.ver.outputs.name }}
          BUILD=${{ steps.ver.outputs.build }}
          MIN=${{ steps.nat.outputs.min }}
          BASE="https://github.com/${{ github.repository }}/releases/download/v$NAME"
          WWW=$(ls www-*.zip | head -1)
          APK=$(ls GestionPrestamos-*.apk | head -1)
          WSHA=$(sha256sum "$WWW" | cut -d' ' -f1)
          jq -n --arg v "$NAME" --argjson b "$BUILD" --argjson m "$MIN" --arg apk "$BASE/$APK" --arg web "$BASE/$WWW" --arg wsha "$WSHA" --arg nh "${{ steps.nat.outputs.hash }}" \
                --argjson size "$(stat -c %s "$APK")" --arg notes "$NOTES" --arg date "$(date -u +%Y-%m-%d)" \
                --arg page "https://github.com/${{ github.repository }}/releases/tag/v$NAME" \
                '{version:$v, build:$b, minNative:$m, apkUrl:$apk, apkSize:$size, webUrl:$web, webSha256:$wsha, nativeHash:$nh, notes:$notes, date:$date, page:$page}' > latest.json
          cat latest.json
          mkdir -p /tmp/upd && cp latest.json /tmp/upd/ && cd /tmp/upd
          git init -q && git checkout -q -b updates
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json && git commit -qm "Última versión: $NAME"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" updates
